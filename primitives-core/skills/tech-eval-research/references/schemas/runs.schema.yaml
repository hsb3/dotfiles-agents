$schema: https://json-schema.org/draft/2020-12/schema
$id: schemas/runs.schema.yaml
title: Proof run record
description: >
  One JSON object per line in runs/<proof-id>/runs.jsonl: one line per measured
  run (a session, a call batch, a latency sample set). This is the raw experimental
  record; findings proofs entries are summaries of these lines. Anything not in the
  fixed fields goes in metrics (numbers) or raw (paths to the artifacts).
type: object
additionalProperties: false
required: [proof, candidate, run_on, condition, run_no, outcome, metrics, artifacts]
properties:
  proof: {type: string, description: Proof id from data/requirements.yaml.}
  candidate: {type: string, description: Candidate id, or "none" for a no-candidate control.}
  run_on: {type: string, description: ISO-8601 timestamp of the run start.}
  agent: {type: string, description: Tool, client or harness that ran the measurement; its version goes in agent_version.}
  agent_version: {type: string}
  model: {type: string}
  condition:
    type: string
    description: Free label that groups comparable runs within a proof, e.g. task id, step id, "cache-on", "query-3".
  step: {type: string, description: Sub-step within a condition, e.g. s1-setup, s2-update.}
  run_no: {type: integer, minimum: 1}
  session_id: {type: string, description: Session or trace id from the tool, when one exists.}
  tokens:
    type: object
    additionalProperties: false
    properties:
      input: {type: integer}
      cache_creation: {type: integer}
      cache_read: {type: integer}
      output: {type: integer}
      total: {type: integer, description: input + cache_creation + cache_read + output.}
      candidate_side: {type: [integer, "null"], description: Tokens the candidate spent on its own side (e.g. server-side processing), 0 if none, null if unknown.}
  tool_calls: {type: integer}
  failures: {type: integer}
  wall_ms: {type: integer}
  outcome:
    type: string
    enum: [pass, fail, error, n/a]
    description: pass/fail against this run's own criterion; error = the run itself broke; n/a = a measurement with no criterion.
  metrics:
    type: object
    additionalProperties: {type: [number, string, boolean, 'null']}
    description: Proof-specific measurements, flat key -> scalar (e.g. p50_ms, hits, errors).
  notes: {type: string}
  artifacts:
    type: array
    items: {type: string}
    description: Repo-relative paths to the transcript / raw JSON / patch behind this line.
