project_name: "dotfiles-agents"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
# Area labels: work on the harness/ and evals/ workbenches is tracked in this same
# backlog — label such tasks/decisions/docs with the area so boards can filter by it.
# Unlabeled items are core-repo work (primitives, assemblies, gates, docs).
labels: ["harness", "evals"]
definition_of_done: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "zed"
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
