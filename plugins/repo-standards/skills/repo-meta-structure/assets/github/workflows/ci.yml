# CI template — the Makefile is the canonical task interface: CI runs `make ci`,
# never raw commands. Adapt the setup steps to the repo's toolchain; keep the
# single aggregate gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make ci
