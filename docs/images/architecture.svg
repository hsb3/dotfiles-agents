<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="880" height="300" rx="10" fill="#11131a"/>

  <!-- source -->
  <rect x="28" y="70" width="190" height="160" rx="8" fill="#1b1e27" stroke="#2a2f3d"/>
  <text x="123" y="58" fill="#9aa5b1" font-size="13" text-anchor="middle">single source</text>
  <text x="123" y="98" fill="#c0caf5" font-size="14" text-anchor="middle" font-weight="bold">primitives-core/</text>
  <text x="123" y="128" fill="#7aa2f7" font-size="13" text-anchor="middle">agent · skill</text>
  <text x="123" y="150" fill="#7aa2f7" font-size="13" text-anchor="middle">mcp · hook</text>
  <text x="123" y="188" fill="#565f89" font-size="11" text-anchor="middle">+ externals.yaml</text>
  <text x="123" y="206" fill="#565f89" font-size="11" text-anchor="middle">(third-party)</text>

  <!-- engine -->
  <rect x="320" y="120" width="200" height="60" rx="8" fill="#1f2a1f" stroke="#3a5a3a"/>
  <text x="420" y="146" fill="#9ece6a" font-size="14" text-anchor="middle" font-weight="bold">make build</text>
  <text x="420" y="166" fill="#7e8aa0" font-size="11" text-anchor="middle">translate.py · deterministic</text>

  <!-- arrows source -> engine -->
  <line x1="218" y1="150" x2="318" y2="150" stroke="#3a4252" stroke-width="2"/>
  <polygon points="318,150 308,145 308,155" fill="#3a4252"/>

  <!-- targets -->
  <rect x="620" y="40" width="232" height="50" rx="8" fill="#1b1e27" stroke="#2a2f3d"/>
  <text x="736" y="62" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="bold">claude-code</text>
  <text x="736" y="80" fill="#565f89" font-size="11" text-anchor="middle">marketplace + raw</text>

  <rect x="620" y="125" width="232" height="50" rx="8" fill="#1b1e27" stroke="#2a2f3d"/>
  <text x="736" y="147" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="bold">opencode</text>
  <text x="736" y="165" fill="#565f89" font-size="11" text-anchor="middle">skills + agents + mcp</text>

  <rect x="620" y="210" width="232" height="50" rx="8" fill="#1b1e27" stroke="#2a2f3d"/>
  <text x="736" y="232" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="bold">claude-agents (CMA)</text>
  <text x="736" y="250" fill="#565f89" font-size="11" text-anchor="middle">static API payloads</text>

  <!-- arrows engine -> targets -->
  <line x1="520" y1="150" x2="618" y2="65" stroke="#3a4252" stroke-width="2"/>
  <polygon points="618,65 606,66 612,75" fill="#3a4252"/>
  <line x1="520" y1="150" x2="618" y2="150" stroke="#3a4252" stroke-width="2"/>
  <polygon points="618,150 608,145 608,155" fill="#3a4252"/>
  <line x1="520" y1="150" x2="618" y2="235" stroke="#3a4252" stroke-width="2"/>
  <polygon points="618,235 612,225 606,234" fill="#3a4252"/>

  <text x="440" y="288" fill="#565f89" font-size="11" text-anchor="middle">targets/ is generated + committed; a CI drift guard regenerates and fails on any diff — never hand-edited</text>
</svg>
