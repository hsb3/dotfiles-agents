# externals.yaml — EXTERNAL / VENDORED EXTENDER TRACKER
#
# External (third-party) extenders are NOT vendored into primitives-core/ (CANON decision 11).
# This tracker records each one's upstream source repo + pinned ref. The build clones them into
# targets/ at distribution time. Distribution is PRIVATE / self-only (this repo stays private),
# so redistribution/licensing is a non-issue; pinning + clone-at-build solves drift.
#
# Entry schema:
#   - id:       <kebab>
#     kind:     plugin | skill | mcp
#     upstream: <git url | docker image | npm:pkg | url>   # provenance; null = TODO: research
#     ref:      <tag|sha|branch>   # pin for reproducible clones; null until upstream known
#     provides: <one line>     # what it gives us
#     targets:  [claude-code, opencode, claude-agents]   # where it deploys
#     spec:     externals/mcp/<id>.json   # kind: mcp ONLY — the neutral connection spec to render
#
# kind: mcp — a third-party MCP server is a CONNECTION SPEC (config), not a cloned bundle (CANON 16).
# The spec (same neutral schema as primitives-core/mcp/, see that README) lives at `spec:` and the
# build renders it to each target's mcp config; secrets are ${VAR} placeholders (Keychain at deploy).
#
# STATUS: skill/plugin upstream URLs are unresearched (CANON open item) — those are NOT cloned yet.
# Only kind: mcp entries render today.

version: 1

externals:
  # --- third-party mcp servers (curated; connection specs, not clones — render today) ---
  - id: github
    kind: mcp
    upstream: ghcr.io/github/github-mcp-server
    ref: latest
    provides: "GitHub MCP — issues, PRs, repos, actions across all toolsets."
    targets: [claude-code, opencode]
    spec: externals/mcp/github.json
  - id: azure-tools
