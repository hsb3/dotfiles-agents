# externals.yaml — EXTERNAL / VENDORED EXTENDER TRACKER
#
# Third-party extenders are NOT vendored into primitives-core/ (ADR 0015 / composition
# principle). This tracker records each one's upstream source repo + pinned ref, by reference
# only. The clone-at-build step that renders these into targets/ under a byte-diff drift guard
# is separate work (DEV-34 / GitHub #36); this file is the recorded intent that step consumes.
# Claude-Code-only distribution (R4): every entry's `targets` carries `claude-code` alone.
#
# Entry schema:
#   - id:       <kebab>                                the roster/catalog id this projects
#     kind:     plugin | skill | mcp                    what upstream form it takes
#     upstream: <git url>                                repo the ref is pinned against
#     path:     <repo-relative path>                     optional — subdir within a monorepo
#                                                         upstream (omitted when upstream IS
#                                                         the thing, e.g. a single-skill repo)
#     ref:      <immutable commit SHA>                   pin for reproducible clones; never a
#                                                         branch name (a branch pins nothing)
#     provides: <one line>                               what it gives us
#     targets:  [claude-code]
#
# Enforcement: scripts/check_provenance.py's ENFORCE_EXTERNALS_INTENT requires every entry here
# to carry non-null upstream + ref — activated once this file is genuinely researched (D5).
#
# Provenance (J5 / decision 0019, accepted 2026-07-17): keep 5 of the 31 previously-unresearched
# entries on the pre-rebuild tree's externals.yaml, drop the other 26 (zero usage signal / no
# resolvable upstream) — see DEV-34 (GitHub #36) for the full research + ruling. SHAs below are
# each repo's HEAD as of the 2026-07-17 research pass, frozen as immutable pins per the ruling
# (re-confirm only on a deliberate bump — not automatically).

version: 1

externals:
  - id: pptx
    kind: skill
    upstream: https://github.com/anthropics/skills
    path: skills/pptx
    ref: fa0fa64bdc967915dc8399e803be67759e1e62b8
    provides: "The .pptx create/edit/analyze base composed under the authored pptx-themes skill (vendored verbatim in primitives-core/skills/pptx-themes/base/). Triggers whenever a .pptx or .potx file is input, output, or referenced. Creates new decks via pptxgenjs scripting; edits existing decks/templates by unzip, modify slide XML, rezip, with scripts to duplicate/reorder slides, prune orphaned parts, and schema/relationship-validate the OOXML; extracts slide text via markitdown and renders labeled thumbnail grids for layout selection; converts formats via headless LibreOffice. Supplies file-format mechanics only — pptx-themes supplies the palette/motif/design-judgment layer this skill omits."
    targets: [claude-code]
  - id: pocketbase-best-practices
    kind: skill
    upstream: https://github.com/greendesertsnow/pocketbase-skills
    path: skills/pocketbase-best-practices
    ref: c573263e84a2066d0564f428dd8160e74fc54226
    provides: "63 prioritized PocketBase design rules across 9 categories (collection design, API rules and access control, auth, SDK usage, query performance, realtime, file handling, deployment, server-side extending), vendored verbatim in primitives-core/skills/pocketbase-best-practices/base/ under the authored routing + field-notes layer. Supplies the rule corpus only — the authored layer supplies the operational/design split and the verified findings that extend it."
    targets: [claude-code]
  - id: carbon-builder
    kind: skill
    upstream: https://github.com/carbon-design-system/carbon-mcp
    path: public/skills/carbon-builder
    ref: 3cbe743d8bc36d6dd3bcfea98ac3ac09bca71f9c
    provides: "IBM's own Carbon Design System skill (v1.2.0), vendored verbatim in primitives-core/skills/carbon-builder/base/ under an authored routing + fallback layer. Query planning, capability matrix, and mandatory context-gathering/code-audit protocol for the five hosted Carbon MCP tools (code_search, docs_search, get_charts, labs_search, code_audit), plus 13 reference files covering frameworks, grid, accessibility, charts, AI Chat, Carbon Labs, pitfalls, and error recovery. The same repo's public/llms.txt rides in the authored layer as the no-MCP docs-index fallback."
    targets: [claude-code]

# ── Not externals: recorded here so the absence is deliberate, not an oversight. ──
#
# `pocketbase` (the operational skill, primitives-core/skills/pocketbase) has NO entry above
# because it has no upstream to pin. It was authored outside any public repository and reached
# its consuming projects by hand-copying; the pre-consolidation original no longer exists on
# disk, and no public repo hosts it. It therefore fails criterion 3 of
# docs/vendoring-rule.md (pinnable + attributable) and is classified `origin: authored` in the
# roster — first-party content this repo maintains, not third-party content awaiting a pin.
# This is the specific reason required by the vendored-skill provenance-coverage work, not a
# bare "skipped".
#
# `kenn-forge` (primitives-core/skills/kenn-forge) has NO entry above either, and its reason is
# the opposite shape: an upstream exists, but these are not its bytes. The forge project
# documents the same tool surface itself, in docs/kenn-forge-mcp.md (146 lines) and
# internal/mcpserver/guidance.md (65 lines) — the same tools, the same triage order, the same
# failure modes. What ships here is a RE-AUTHORED condensation of those facts into an operator
# surface. Measured against both upstream files concatenated: 0 verbatim sentences of 8 or more
# words, and a longest shared token run of 8 — `use force true only for a deliberate override`,
# which is a parameter name plus a generic instruction. ADR 0015 names exactly this route:
# "Promotion of an external into first-party status means re-authoring it as an original for
# the same job (origin: authored, no upstream), not copying the shipped body." So there is no
# ref to pin and no third-party grant to carry, and it fails criterion 3 of
# docs/vendoring-rule.md (pinnable + attributable).
#
# Upstream's license is the Elastic License 2.0 — GitHub reports NOASSERTION only because ELv2
# is not OSI-listed in its classifier — and the repo's NOTICE keeps contributions up to and
# including commit 4b28941c under MIT, everything after under ELv2. ELv2 is source-available,
# and none of those bytes are redistributed here. The skill's inherited `license: MIT`
# frontmatter was dropped for that specific reason: the project has since relicensed, so the
# line asserted a grant that no longer exists upstream and was never ours to make. (An authored
# skill MAY carry a license line — readme-value-and-proof does — so the drop is about this
# inherited claim being false, not about the key.)
