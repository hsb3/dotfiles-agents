# externals.yaml — EXTERNAL / VENDORED EXTENDER TRACKER
#
# Third-party extenders are NOT vendored into primitives-core/ (ADR 0015 / composition
# principle). This tracker records each one's upstream source repo + pinned ref, by reference
# only. The clone-at-build step that renders these into targets/ under a byte-diff drift guard
# is separate work (DEV-34 / GitHub #36); this file is the recorded intent that step consumes.
# `targets` identifies the clients for which an external is recorded; reference-only entries
# are not installed or projected merely because they name a client.
#
# Entry schema:
#   - id:       <kebab>                                the roster/catalog id this projects
#     kind:     plugin | skill | mcp                    what upstream form it takes
#     upstream: <git url>                                repo the ref is pinned against
#     path:     <repo-relative path>                     optional — subdir within a monorepo
#                                                         upstream (omitted when upstream IS
#                                                         the thing, e.g. a single-skill repo)
#     ref:      <immutable commit SHA>                   pin for reproducible clones; never a
#                                                         branch name (a branch pins nothing)
#     provides: <one line>                               what it gives us
#     targets:  [claude-code, codex]
#
# Enforcement: scripts/check_provenance.py's ENFORCE_EXTERNALS_INTENT requires every entry here
# to carry non-null upstream + ref — activated once this file is genuinely researched (D5).
#
# Provenance (J5 / decision 0019, accepted 2026-07-17): keep 5 of the 31 previously-unresearched
# entries on the pre-rebuild tree's externals.yaml, drop the other 26 (zero usage signal / no
# resolvable upstream) — see DEV-34 (GitHub #36) for the full research + ruling. SHAs below are
# each repo's HEAD as of the 2026-07-17 research pass, frozen as immutable pins per the ruling
# (re-confirm only on a deliberate bump — not automatically).

version: 1

externals:
  - id: kata
    kind: plugin
    upstream: https://github.com/hsb3/kata-oversight
    path: plugins/kata
    ref: fced756974bed7c7288276568d43e83759218e6b
    provides: "Cross-marketplace companion for board-desk: Kata workflow, wiring checks and per-card definition/dependency audits. Reference only; no upstream bytes are copied into this marketplace."
    targets: [claude-code, codex]
  - id: pocketbase-best-practices
    kind: skill
    upstream: https://github.com/greendesertsnow/pocketbase-skills
    path: skills/pocketbase-best-practices
    ref: c573263e84a2066d0564f428dd8160e74fc54226
    provides: "63 prioritized PocketBase design rules across 9 categories (collection design, API rules and access control, auth, SDK usage, query performance, realtime, file handling, deployment, server-side extending), vendored verbatim in primitives-core/skills/pocketbase-best-practices/base/ under the authored routing + field-notes layer. Supplies the rule corpus only — the authored layer supplies the operational/design split and the verified findings that extend it."
    targets: [claude-code]
  - id: carbon-builder
    kind: skill
    upstream: https://github.com/carbon-design-system/carbon-mcp
    path: public/skills/carbon-builder
    ref: 3cbe743d8bc36d6dd3bcfea98ac3ac09bca71f9c
    provides: "IBM's own Carbon Design System skill (v1.2.0), vendored verbatim in primitives-core/skills/carbon-builder/base/ under an authored routing + fallback layer. Query planning, capability matrix, and mandatory context-gathering/code-audit protocol for the five hosted Carbon MCP tools (code_search, docs_search, get_charts, labs_search, code_audit), plus 13 reference files covering frameworks, grid, accessibility, charts, AI Chat, Carbon Labs, pitfalls, and error recovery. The no-MCP index also byte-matches carbon-design-system/carbon-website static/llms.txt at 996791935ba9edc7977fc12d7b16548181402c14; that tree's Apache-2.0 LICENSE (Copyright 2018 IBM Corp.) covers the index and src/pages/developing/carbon-mcp/prompts.mdx condensed in references/prompting.md. The skill README records this separate source and its notices."
    targets: [claude-code]

  - id: langchain-skills
    kind: plugin
    upstream: https://github.com/langchain-ai/langchain-skills
    ref: b7a2a8fc363d1711456f83d24230535c9fff93eb
    provides: "Personal toolbox reference for LangChain, LangGraph and Deep Agents skills, installed directly from upstream. Reference only; this marketplace does not redistribute the skill contents."
    targets: [claude-code, codex]
  - id: langsmith-skills
    kind: plugin
    upstream: https://github.com/langchain-ai/langsmith-skills
    ref: e8f4120a876b80ced98bce1bb21d6b9f4d62cdb8
    provides: "Personal toolbox reference for LangSmith trace, dataset and evaluator skills, installed directly from upstream. Reference only; this marketplace does not redistribute the skill contents."
    targets: [claude-code, codex]

# `cmux` below is REFERENCE ONLY, and the license is one reason it stays that way. Upstream is
# GPL-3.0-or-later — the repo-root LICENSE reads "material contributed under the cmux project
# license is licensed under the GNU General Public License v3.0 or later (GPL-3.0-or-later)",
# with a Manaflow carve-out offering separate commercial terms only for material it controls
# the rights to, and a THIRD_PARTY_LICENSES.md plus file-level notices covering the rest
# (verified 2026-09-07 via `gh api repos/manaflow-ai/cmux/contents/LICENSE`). Vendoring those
# bytes would carry a copyleft grant into every install of this marketplace, so the entry
# records the pin and the shape of the curated set and copies nothing. It has no roster entry
# and no plugin, so nothing renders or drift-checks it.
  - id: cmux
    kind: skill
    upstream: https://github.com/manaflow-ai/cmux
    path: skills
    ref: 2505c9bc5af912b0ae53e22dfb58a25e40945559
    provides: "The four cmux control skills — `cmux` (window/workspace/pane/surface topology, placement, focus and moves), `cmux-browser` (browser-surface automation: open, snapshot for element refs, act, wait for state, extract), `cmux-workspace` (scoping work to the caller's workspace and terminal without stealing the user's focus), and `cmux-settings` (reading and writing ~/.config/cmux/cmux.json by JSON path against the published schema) — 4 of the 20 skill directories in upstream's `skills/` tree at this ref, the subset that drives a running cmux app rather than developing cmux itself. Reference only: nothing is vendored here and no roster entry, plugin, or marketplace listing projects it. The ref is the commit at which four locally-held copies were verified byte-identical to upstream `skills/<name>/`; upstream `main` has since moved."
    targets: [claude-code]

# ── Not externals: recorded here so the absence is deliberate, not an oversight. ──
#
# `pocketbase` (the operational skill, primitives-core/skills/pocketbase) has NO entry above
# because it has no upstream to pin. It was authored outside any public repository and reached
# its consuming projects by hand-copying; the pre-consolidation original no longer exists on
# disk, and no public repo hosts it. It therefore fails criterion 3 of
# docs/vendoring-rule.md (pinnable + attributable) and is classified `origin: authored` in the
# roster — first-party content this repo maintains, not third-party content awaiting a pin.
# This is the specific reason required by the vendored-skill provenance-coverage work, not a
# bare "skipped".
#
# The retired `kenn-forge` skill had no entry above because an upstream existed but its local
# bytes were not upstream bytes. The forge project
# documents the same tool surface in docs/kenn-forge-mcp.md and
# internal/mcpserver/guidance.md. The re-authorship rationale is retained as a claim,
# not license clearance. A reproducible comparison uses kenn-io/forge revision
# 306610c81a2e67ab16c42b683dfd29e91d4dd2c5 against local import
# ee391d14bdbe3a82213af1b309015a575ae6867c. Lowercase + Python re.findall(r'\w+', text)
# yields an eight-token longest match; other tokenization yields nine. These metrics
# cannot establish independent authorship. Full method and residual decision:
# docs/licenses.md, "Consumer release and historical visibility decisions".
#
# That upstream revision's NOTICE retains MIT for contributions through
# 4b28941cbbc27b30747e39269ba86c0cb2a3e92c; later contributions use ELv2. The earlier
# grant did not disappear. The removed MIT frontmatter was not substantiated for
# this particular condensation. Resolve independent authorship or applicable terms
# before treating retained historical kenn-forge copies as cleared. Retirement removes the
# current roster/plugin/install surface; it does not resolve the historical rights question.
