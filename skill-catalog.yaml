# skill-catalog.yaml — THE STANDALONE SKILL CATALOG
#
# The set of skills that qualify to ship *standalone* — one skill installed on its own,
# without taking a whole plugin bundle. Claude Code gets a generated one-skill marketplace
# plugin per entry (scripts/gen_standalone.py, wired into `make build`). The skill BODY still
# lives once in primitives-core/skills/<id>/ — this catalog is a thin projection that only
# references roster ids and adds the standalone-specific fields; it never re-authors source,
# provenance, or `requires`, which stay owned by the roster (primitives-core.yaml).
# scripts/check_skill_catalog.py enforces eligibility + catalog<->roster drift + the
# namespacing invariant, and runs in `make ci`.
#
# Claude-Code-only distribution (R4): `clients` carries `claude-code` alone.
#
# Entry schema (thin projection — everything else is read from the roster):
#   id                 the roster skill id this entry projects (must be type: skill)
#   standalone         true — installable on its own (the only value today)
#   clients            [claude-code] — must be a subset of the roster targets[]
#   depends_on_skills  [] — asserted empty; a non-empty value disqualifies (no sibling coupling)
#   prerequisites      advisory cli:/env: needs the installer PRINTS (never rejects)
#   provenance         must equal the roster `origin` for this id (drift-checked)
#
# D4 seeds the mechanism with `private-fork` ONLY — a skill that ships BOTH in the
# repo-standards bundle and as a one-skill install, proving the standalone mechanism coexists
# with bundles. The five standalone-only skills (carbon-builder, notion-api, opencode-expertise,
# dlt-pipelines, subagent-creator) are R2-remainder-gated and populate the catalog in a later
# slice once they're ported into the rebuilt tree.

version: 1

skills:
  - id: private-fork
    standalone: true
    clients: [claude-code]
    depends_on_skills: []
    prerequisites: []
    provenance: authored
