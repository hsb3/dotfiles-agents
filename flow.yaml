# flow.yaml — THE REPO-FLOW DAG
#
# Machine-readable map of every part of this repo and the flow between parts:
# which paths are authored vs generated vs runtime, what generates what, what
# gates what, what publishes where, and where the eval feedback loop re-enters
# through the owner. scripts/check_flow.py enforces it (make flow, in `make ci`):
# every top-level tracked path must be claimed by exactly one current node,
# planned paths must not exist yet, generated nodes must name a live generator
# and guard, and the automated-edge graph must be acyclic — the only cycles
# allowed run through `mode: manual` edges (the owner). docs/FLOW.md renders
# this manifest; its DAG block is generated by `check_flow.py --write-doc`.
#
# Node schema: id · layer{source|roster|generator|gate|dist|publish|docs|
#   workbench|runtime|consumer} · class{authored|generated|runtime|virtual} ·
#   status{current|planned} · paths[top-level names] · generator+guard
#   (required when class: generated) · note
# Edge schema: from · to · kind{generates|gates|consumes|ingests|reports|
#   publishes|installs|curates} · mode{automated|manual} · status (default
#   current) · via (file path; must exist for current edges)

version: 1

nodes:
  - id: primitive-bodies
    layer: source
    class: authored
    status: current
    paths: [primitives-core, hooks]
    note: "Single source copy of every primitive: skills, agents, hooks. A skill's README travels with it (primitives-core/skills/<id>/README.md, ADR 0017). hooks/ is the empty ratified-layout placeholder."
  - id: roster
    layer: roster
    class: authored
    status: current
    paths: [primitives-core.yaml]
    note: "THE ROSTER — provenance manifest (ADR 0017: id/type/source/origin/disposition/targets/requires); plugin membership lives in the symlink assemblies, not here. disposition is the owner-curated verdict field."
  - id: externals
    layer: roster
    class: authored
    status: current
    paths: [externals.yaml]
    note: "Third-party extenders by reference only, upstream plus pinned SHA; clone-at-build is deferred to issues 36 and 122."
  - id: toolchain
    layer: generator
    class: authored
    status: current
    paths: [scripts]
    note: "Every floor and assembly checker, the install-time opencode lane (gen_opencode.py + install_opencode.sh), and the weekly campaign runner. The via field on edges names the specific script."
  - id: gates
    layer: gate
    class: authored
    status: current
    paths: [Makefile, tests, .github, .gitignore, flow.yaml]
    note: "Task interface, stdlib unit tests, CI workflows, tracking policy, and this flow manifest itself. make ci is the canonical PR gate."
  - id: repo-docs
    layer: docs
    class: authored
    status: current
    paths: [README.md, AGENTS.md, CLAUDE.md, docs]
    note: "Entry docs, contributor SOP, ADRs, and this flow's rendered form docs/FLOW.md."
  - id: desk
    layer: workbench
    class: authored
    status: current
    paths: [_meta]
    note: "Tracked working desk per ADR 0006: handoff, briefings, research; operations content stays untracked."
  - id: harness
    layer: workbench
    class: authored
    status: current
    paths: [harness]
    note: "Self-contained uv eval project; runs candidates injected from primitives-core sources; appends tracked results.jsonl; own CI lane, never in make ci."
  - id: evals
    layer: workbench
    class: authored
    status: current
    paths: [evals]
    note: "extender-db PocketBase projection for analysis — never a source of truth; ingests roster, sources, and harness results; renders coverage and analysis reports."
  - id: local-dev-tooling
    layer: workbench
    class: authored
    status: current
    paths: [.claude, .vscode]
    note: "Project-local session tooling: under .claude/, the pocketbase-best-practices and publish-to-main skills, tracked project memory (.claude/memory/), the project hooks settings, and the no-main-checkout PreToolUse guard (.claude/hooks/); the autoMemoryDirectory redirect is machine-local (settings.local.json, untracked — repo path differs per machine); under .vscode/, git.branchProtection for main. Not roster primitives; never distributed."
  - id: runtime-logs
    layer: runtime
    class: runtime
    status: current
    paths: [logs]
    note: "Hook telemetry accumulates here at session runtime; gitignored, must never be tracked."
  - id: publish-main
    layer: publish
    class: virtual
    status: current
    paths: []
    note: "The published main branch — the surface consumers currently resolve. The publish workflow still assembles from the retired dist lanes, so a dispatch now fails loudly at assembly; what publishing means under ADR 0017 is the open task-5 decision. The workbench never publishes."
  - id: consumers
    layer: consumer
    class: virtual
    status: current
    paths: []
    note: "Machines installing via claude plugin marketplace add (the pointer surface) and the opencode laydown installer (scripts/install_opencode.sh, generating at install time per ADR 0017)."
  - id: backlog
    layer: workbench
    class: authored
    status: current
    paths: [backlog]
    note: "Backlog.md task system — THE task-management surface (decision-1, 2026-08-03): tasks, drafts, decisions, milestones. GitHub issues are bug-report intake only; a reported bug gets a backlog task when planned."
  - id: plugin-assemblies
    layer: dist
    class: authored
    status: current
    paths: [plugins, .claude-plugin]
    note: "Pointer-based marketplace surface (ADR 0017): plugins/<id>/ as hand-authored thin symlink assemblies over primitives-core/ (plugin.json + hooks.json regular files; skills/agents/hooks as in-repo symlinks; bundle READMEs regular, standalone READMEs symlinked to the skill's README) plus the root .claude-plugin/marketplace.json listing each plugin by relative source. Claude Code dereferences at install; guarded by scripts/check_symlinks.py (make symlinks). Replaced the dist lanes (task-3)."
  - id: translation-config
    layer: roster
    class: authored
    status: current
    paths: [translation.yaml]
    note: "Capability matrix per primitive type x target (native, transform, render, unsupported) plus model-alias pins and roster-level exclusions with reasons — read by gen_opencode.py; precedent in dropped translate.py, commit 4e8a05b."

edges:
  - from: gates
    to: primitive-bodies
    kind: gates
    mode: automated
    via: scripts/check_identity.py
  - from: primitive-bodies
    to: plugin-assemblies
    kind: consumes
    mode: manual
  - from: gates
    to: plugin-assemblies
    kind: gates
    mode: automated
    via: scripts/check_symlinks.py
  - from: primitive-bodies
    to: harness
    kind: consumes
    mode: automated
    via: scripts/harness_campaign.sh
  - from: harness
    to: evals
    kind: ingests
    mode: automated
    via: evals/load_harness_runs.py
  - from: evals
    to: desk
    kind: reports
    mode: automated
    via: evals/report.py
  - from: publish-main
    to: consumers
    kind: installs
    mode: manual
  - from: primitive-bodies
    to: consumers
    kind: installs
    mode: manual
    via: scripts/install_opencode.sh
  - from: evals
    to: roster
    kind: curates
    mode: manual
  - from: evals
    to: primitive-bodies
    kind: curates
    mode: manual
