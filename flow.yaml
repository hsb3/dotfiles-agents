# flow.yaml — THE REPO-FLOW DAG
#
# Machine-readable map of every part of this repo and the flow between parts:
# which paths are authored vs generated vs runtime, what generates what, what
# gates what, what publishes where, and where the eval feedback loop re-enters
# through the owner. scripts/check_flow.py enforces it (make flow, in `make ci`):
# every top-level tracked path must be claimed by exactly one current node,
# planned paths must not exist yet, generated nodes must name a live generator
# and guard, and the automated-edge graph must be acyclic — the only cycles
# allowed run through `mode: manual` edges (the owner). docs/FLOW.md renders
# this manifest; its DAG block is generated by `check_flow.py --write-doc`.
#
# Node schema: id · layer{source|roster|generator|gate|dist|publish|docs|
#   workbench|runtime|consumer} · class{authored|generated|runtime|virtual} ·
#   status{current|planned} · paths[top-level names] · generator+guard
#   (required when class: generated) · note
# Edge schema: from · to · kind{generates|gates|consumes|ingests|reports|
#   publishes|installs|curates} · mode{automated|manual} · status (default
#   current) · via (file path; must exist for current edges)

version: 1

nodes:
  - id: primitive-bodies
    layer: source
    class: authored
    status: current
    paths: [primitives-core, hooks]
    note: "Single source copy of every primitive: skills, agents, hooks, bundle and standalone README sources. hooks/ is the empty ratified-layout placeholder."
  - id: roster
    layer: roster
    class: authored
    status: current
    paths: [primitives-core.yaml]
    note: "THE ROSTER — authoritative membership manifest; targets field selects vendor lanes; disposition is the owner-curated verdict field."
  - id: bundle-metadata
    layer: roster
    class: authored
    status: current
    paths: [plugins.yaml]
    note: "Bundle id, kind, version, description per distributed plugin."
  - id: standalone-catalog
    layer: roster
    class: authored
    status: current
    paths: [skill-catalog.yaml]
    note: "Thin roster projection listing skills cleared to ship as one-skill plugins."
  - id: externals
    layer: roster
    class: authored
    status: current
    paths: [externals.yaml]
    note: "Third-party extenders by reference only, upstream plus pinned SHA; clone-at-build is deferred to issues 36 and 122."
  - id: toolchain
    layer: generator
    class: authored
    status: current
    paths: [scripts]
    note: "Generators plus every floor and drift checker plus the weekly campaign runner. The via field on edges names the specific script."
  - id: gates
    layer: gate
    class: authored
    status: current
    paths: [Makefile, tests, .github, .gitignore]
    note: "Task interface, stdlib unit tests, CI workflows, tracking policy. make ci is the canonical PR gate."
  - id: dist-claude-code
    layer: dist
    class: generated
    status: current
    paths: [plugins, .claude-plugin, PLUGINS.md]
    generator: scripts/gen_marketplace.py
    guard: build-check
    note: "Assembled Claude Code marketplace surface, currently at repo root; ADR 0008 plans its move under dist/claude-code with the publish lift keeping main's root shape."
  - id: repo-docs
    layer: docs
    class: authored
    status: current
    paths: [README.md, AGENTS.md, CLAUDE.md, docs]
    note: "Entry docs, contributor SOP, ADRs, and this flow's rendered form docs/FLOW.md."
  - id: desk
    layer: workbench
    class: authored
    status: current
    paths: [_meta]
    note: "Tracked working desk per ADR 0006: handoff, briefings, research; operations content stays untracked."
  - id: harness
    layer: workbench
    class: authored
    status: current
    paths: [harness]
    note: "Self-contained uv eval project; runs candidates injected from primitives-core sources; appends tracked results.jsonl; own CI lane, never in make ci."
  - id: evals
    layer: workbench
    class: authored
    status: current
    paths: [evals]
    note: "extender-db PocketBase projection for analysis — never a source of truth; ingests roster, sources, and harness results; renders coverage and analysis reports."
  - id: local-dev-tooling
    layer: workbench
    class: authored
    status: current
    paths: [.agents, .claude, skills-lock.json]
    note: "Project-local session tooling: vendored pocketbase skill plus lockfile, repo dev skills, agent memory. Not roster primitives; never distributed."
  - id: runtime-logs
    layer: runtime
    class: runtime
    status: current
    paths: [logs]
    note: "Hook telemetry accumulates here at session runtime; gitignored, must never be tracked."
  - id: publish-main
    layer: publish
    class: virtual
    status: current
    paths: []
    note: "The published main branch — the surface consumers resolve. Advanced only by the publish workflow; ADR 0008 plans a filtered parented assembly instead of a whole-tree force push."
  - id: consumers
    layer: consumer
    class: virtual
    status: current
    paths: []
    note: "Machines installing via claude plugin marketplace add and, planned, the opencode laydown installer."
  - id: dist-vendor-lanes
    layer: dist
    class: generated
    status: planned
    paths: [dist]
    generator: scripts/gen_opencode.py
    guard: build-check
    note: "ADR 0008 target home: dist/claude-code plus dist/opencode — the opencode lane is a laydown tree with skills, remapped agents, one config fragment, an installer, and an explicit exclusions manifest; hooks excluded until TS wrapper codegen."
  - id: translation-config
    layer: roster
    class: authored
    status: planned
    paths: [translation.yaml]
    note: "Revived capability matrix per primitive type x target: native, transform, render, unsupported — precedent in dropped translate.py, commit 4e8a05b."

edges:
  - from: roster
    to: dist-claude-code
    kind: generates
    mode: automated
    via: scripts/gen_marketplace.py
  - from: primitive-bodies
    to: dist-claude-code
    kind: generates
    mode: automated
    via: scripts/gen_marketplace.py
  - from: bundle-metadata
    to: dist-claude-code
    kind: generates
    mode: automated
    via: scripts/gen_marketplace.py
  - from: standalone-catalog
    to: dist-claude-code
    kind: generates
    mode: automated
    via: scripts/gen_standalone.py
  - from: gates
    to: primitive-bodies
    kind: gates
    mode: automated
    via: scripts/check_identity.py
  - from: gates
    to: dist-claude-code
    kind: gates
    mode: automated
    via: scripts/gen_marketplace.py
  - from: primitive-bodies
    to: harness
    kind: consumes
    mode: automated
    via: scripts/harness_campaign.sh
  - from: harness
    to: evals
    kind: ingests
    mode: automated
    via: evals/load_harness_runs.py
  - from: evals
    to: desk
    kind: reports
    mode: automated
    via: evals/report.py
  - from: dist-claude-code
    to: publish-main
    kind: publishes
    mode: manual
    via: .github/workflows/publish.yml
  - from: publish-main
    to: consumers
    kind: installs
    mode: manual
  - from: evals
    to: roster
    kind: curates
    mode: manual
  - from: evals
    to: primitive-bodies
    kind: curates
    mode: manual
  - from: externals
    to: dist-claude-code
    kind: generates
    mode: automated
    status: planned
  - from: roster
    to: dist-vendor-lanes
    kind: generates
    mode: automated
    status: planned
  - from: primitive-bodies
    to: dist-vendor-lanes
    kind: generates
    mode: automated
    status: planned
  - from: translation-config
    to: dist-vendor-lanes
    kind: generates
    mode: automated
    status: planned
  - from: dist-vendor-lanes
    to: publish-main
    kind: publishes
    mode: manual
    status: planned
