[project]
name = "agent-harness"
version = "0.1.0"
description = "Reusable extender-evaluation harness: drive Claude Code / opencode headlessly against a fixture workspace with a candidate extender injected, grade, append one ledger row."
readme = "README.md"
requires-python = ">=3.12"
# Stdlib-only by design (deps are allowed per DESIGN §8-D1; none needed yet).
dependencies = []

[project.scripts]
agent-harness = "agent_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]
