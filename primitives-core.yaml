# primitives-core.yaml — THE ROSTER (provenance manifest)
#
# Authoritative manifest of every primitive, slimmed to provenance per ADR 0017: the
# drift guard (scripts/check_roster.py) reads this file, not a directory listing, and the
# provenance gate (scripts/check_provenance.py, ADR 0015) enforces the self-authored-only
# rule against it. Plugin MEMBERSHIP is no longer a roster field — membership is the
# symlink assemblies under plugins/<id>/ (guarded by scripts/check_symlinks.py).
#
# Entry schema (see primitives-core/README.md):
#   id · type{skill|agent|mcp|hook} · source · origin{authored|sourced|vendored} ·
#   disposition{qualified|grandfathered-pending-use|demoted|untriaged|orphaned} · targets[] ·
#   requires[] (optional; absent = no needs) — capability words {hooks|local-mcp|hosted-mcp}
#   plus dependency declarations cli:<kebab> (a binary/app that must be installed) and
#   env:<kebab> (machine state, e.g. env:dotfiles) — issue #79
# origin is provenance (authored here, sourced from upstream, or vendored in-tree). Immutable
# per entry. origin: sourced entries must carry non-null `upstream:` and `ref:` (enforced by
# check_roster.py). origin: vendored entries must carry non-null `upstream:` + `ref:` + LICENSE
# file + attribution in README (enforced by check_provenance.py; see docs/vendoring-rule.md).
# targets selects runtimes: claude-code installs the symlink assemblies natively; opencode is
# generated at install time (gen_opencode.py, task-4).

version: 1

