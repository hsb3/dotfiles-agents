    summary: "Size a substantial task and run the session as a foreman: pick a delegation architecture (A-E), bind slices to the scout/builder/reviewer/lead agents with dispatch-time model tiers, hold the never-delegated floor, and apply findings-backed context-hygiene defaults. Self-contained delegation doctrine."
