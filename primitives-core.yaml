# primitives-core.yaml — THE ROSTER
#
# Authoritative manifest of every primitive. Manifest-over-filename-sort: the translation
# service and the roster<->disk drift guard read this file, not a directory listing.
# Populated by the Phase 2a migration (homegrown LIVE skills + agents). Hooks + the
# command-folding land in Phase 2b; externals are tracked separately in externals.yaml.
#
# Entry schema (see primitives-core/README.md):
#   id · type · source · shelf{core|toggle} · origin{authored|sourced} ·
#   disposition{qualified|grandfathered-pending-use|demoted|untriaged} · vendor · targets[] ·
#   plugins[] · summary · requires[]{hooks|local-mcp|hosted-mcp} (optional; absent = no needs)
# origin is provenance (authored here vs sourced from upstream) and is immutable per entry;
# origin: sourced entries must carry non-null `upstream:` and `ref:` fields.
# The untriaged disposition is a migration placeholder ("pre-seeded, not yet dispositioned",
# Q-13); real disposition values are written by the promotion/re-qualification workflow.
# Capability per (type x target) is derived from primitives-core-translation-config.yaml, not
# here — except per-primitive runtime capability needs, which `requires:` records on the entry.

