name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Tier-1 entry-gate machine floor — required status check on every PR into dev.
  # A red floor is not mergeable (identity-neutrality · tests · provenance · hook-layout).
  #
  # runs-on ternary: setting the repo Actions variable USE_FALLBACK_RUNNER=true routes
  # these jobs to the local Docker-based ephemeral runner (`gh-runner-fallback run`,
  # ~/dotfiles _docs/reference/gh-runner-fallback.md) during a GitHub-hosted runner
  # outage. A repo variable rather than the documented workflow_dispatch input because
  # this repo's default branch is publish-only: a dispatch trigger could not land there
  # without a publish, but pull_request runs use the PR branch's own workflow file.
  # Unset the variable after the outage; unset, the ternary is 'ubuntu-latest'.
  entry-gate-floor:
    name: entry-gate floor (identity · tests · provenance · hook-layout)
    runs-on: ${{ vars.USE_FALLBACK_RUNNER == 'true' && fromJSON('["self-hosted","docker-fallback"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make floor

  # Distribution-surface guards — roster<->disk (provenance manifest), symlink-assembly
  # lint (ADR 0017), repo-flow DAG (flow.yaml <-> tree). The job name is PINNED by dev's
  # branch-protection required checks — renaming it strands PRs on a check that never
  # reports; update the protection setting first if it must change (which is why it still
  # reads "marketplace · catalog" after ADR 0017 retired those artifacts).
  drift-guards:
    name: drift guards (roster · marketplace · catalog)
    runs-on: ${{ vars.USE_FALLBACK_RUNNER == 'true' && fromJSON('["self-hosted","docker-fallback"]') || 'ubuntu-latest' }}
    steps:
      # fetch-depth: 0 is load-bearing for the README-currency gate inside `make check`
      # (decision-015): it derives currency from `git log` per unit, and in the default
      # depth-1 checkout every unit's body and README share the one synthetic commit, so
      # the gate would pass vacuously. It fails loud on a shallow clone rather than
      # reporting that green — full history here is what keeps it honest.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make check symlinks flow
      # Version-bump gate (TASK-032): each plugin's assembly, dereferenced, against the
      # same plugin as published on origin/main — changed bytes must ship under a moved
      # version or consumers keep serving the cached one. It rides THIS job rather than
      # `make ci` because it needs network to reach origin/main and `make ci` is offline +
      # zero-install by design; and rather than a job of its own because dev's branch
      # protection pins required checks by job NAME (a new one would strand open PRs on a
      # check that never reports). It fetches origin/main itself and exits 0 with a notice
      # when that ref is unreachable, so a network blip does not block every PR.
      - name: version-bump gate (published bytes vs origin/main)
        run: python3 scripts/check_version_bump.py
      # Vendored-drift gate: every `origin: vendored` base/ against its pinned upstream ref
      # (docs/vendoring-rule.md). Rides this job for the same two reasons as the gate above
      # — it needs network to reach the upstream, and dev's branch protection pins required
      # checks by job NAME. Skips an entry with a notice when the upstream is unreachable,
      # so a network blip does not block every PR; a reachable upstream missing the ref, or
      # a base/ that no longer matches, is red.
      - name: vendored-drift gate (base/ vs pinned upstream ref)
        run: python3 scripts/check_vendored_drift.py
      # Manifest gate: the first-party validator over the marketplace and every assembly.
      # `--strict` turns warnings into failures, catching what the runtime tolerates in
      # silence — an unrecognized field (a `changelog:` key nothing reads), missing
      # attribution. It rides THIS job for the same reason as the two gates above: dev's
      # branch protection pins required checks by job NAME, so a new gate joins an existing
      # job rather than adding one. It is out of `make ci` because it needs the `claude`
      # binary and `make ci` is offline + zero-install by design.
      #
      # A missing binary is a FAILURE, not a skip — see scripts/check_manifests.py. That is
      # why the install step below is not `continue-on-error`.
      # PINNED TO WHAT LOCAL DEV MACHINES RUN — the `stable` tag. The pin is a correctness
      # control, not tidiness, and matching local is the point: an unpinned `npm install -g`
      # installs `latest`, and `latest` disagrees with `stable` about this gate — the newer
      # CLI warns about symlinks where `stable` is silent, and --strict makes a warning
      # fatal. A gate that fails only in CI is a gate nobody can reproduce, so CI tracks the
      # machines rather than the other way round. Bump this when local `stable` moves, and
      # re-run the gate when you do.
      # Explicit rather than relying on the hosted image's preinstalled node, so the
      # job also runs on the fallback runner container (which ships no node).
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.263
      - name: manifest gate (claude plugin validate --strict)
        run: make manifests
