name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Tier-1 entry-gate machine floor — required status check on every PR into dev.
  # A red floor is not mergeable (identity-neutrality · tests · provenance · hook-layout).
  entry-gate-floor:
    name: entry-gate floor (identity · tests · provenance · hook-layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make floor

  # Distribution-surface guards — roster<->disk (provenance manifest), symlink-assembly
  # lint (ADR 0017), repo-flow DAG (flow.yaml <-> tree). The job name is PINNED by dev's
  # branch-protection required checks — renaming it strands PRs on a check that never
  # reports; update the protection setting first if it must change (which is why it still
  # reads "marketplace · catalog" after ADR 0017 retired those artifacts).
  drift-guards:
    name: drift guards (roster · marketplace · catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make check symlinks flow
