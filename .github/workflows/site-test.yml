name: site-test

# Path-filtered lane for the documentation-site renderer (site/) — its own Bun unit, kept
# out of the zero-install `make ci`. Runs only when site/ (or this workflow) changes.
# The real-repo build and link check runs in ci.yml's drift guards job (make docs-build).
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-test.yml"

permissions:
  contents: read

jobs:
  site-test:
    name: site unit tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: make site-test
