name: harness-test

# Path-filtered lane for the agent harness (harness/) — its own Bun unit, kept out of the
# zero-install `make ci`. Runs only when harness/ (or this workflow) changes. Tests replay
# recorded CLI streams through stub executables; no real agent CLI or API key is used.
on:
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness-test.yml"

permissions:
  contents: read

jobs:
  harness-test:
    name: harness unit tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: make harness-test
