name: Bug
description: Something behaves incorrectly and needs a fix.
title: "component: outcome in plain language"
labels: ["type:fix"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The observed behavior, with steps to reproduce if known.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: >-
        Independently verifiable criteria: a command that passes, an artifact that
        exists.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to related PRs, ADRs, or issues.
    validations:
      required: false
