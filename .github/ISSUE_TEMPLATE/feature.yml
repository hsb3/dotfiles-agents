name: Feature
description: A new capability or deliverable to build.
title: "component: outcome in plain language"
labels: ["type:feat"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The deliverable in plain language; spell out any codename.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves or the value it delivers.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: >-
        Independently verifiable criteria: a command that passes, an artifact that
        exists.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to related PRs, ADRs, or issues.
    validations:
      required: false
